<!doctype html>
<html lang="de-CH">
<head><meta charset="utf-8"><title>Kartengalerie – Hansis Jass</title>
<link rel="stylesheet" href="../src/ui/styles.css">
<style>
  html, body { overflow: auto; height: auto; }
  body { padding: 20px; background: #0f5132; }
  .row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .card { --cw: 120px; }
  body.big .card { --cw: 250px; }
</style></head>
<body>
<div id="fr"></div><div id="de"></div>
<script type="module">
  import { cardElement, setPortraits } from '../src/ui/cards-view.js';
  try { setPortraits({ enabled: true, ...JSON.parse(localStorage.getItem('hansis-jass-portraits') || '{}') }); } catch { /* keine */ }
  for (const style of ['fr', 'de']) {
    const box = document.getElementById(style);
    for (let s = 0; s < 4; s++) {
      const row = document.createElement('div');
      row.className = 'row';
      for (let r = 0; r < 9; r++) row.appendChild(cardElement(s * 9 + r, style));
      box.appendChild(row);
    }
  }
</script>
</body>
</html>
